<div class="layout">
  <nav class="sidebar">
    <div class="sidebar-title">Flight Sim</div>
    @for (app of apps; track app.path) {
      <a
        class="sidebar-item"
        routerLink="/{{ app.path }}"
        routerLinkActive="active"
      >
        <span class="sidebar-icon">{{ app.icon }}</span>
        <span class="sidebar-label">{{ app.label }}</span>
      </a>
    }
  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
