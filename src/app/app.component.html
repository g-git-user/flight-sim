<div class="layout">
  <nav
    class="sidebar"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <div class="sidebar-title">Flight Sim</div>

    <div class="sidebar-pages-container">
      <div
        class="sidebar-pages"
        [style.transform]="'translateX(-' + (currentPage() * 100) + '%)'"
      >
        @for (page of appPages(); track $index) {
          <div class="sidebar-page">
            @for (app of page; track app.path) {
              <a
                class="sidebar-item"
                [routerLink]="'/' + app.path"
                routerLinkActive="active"
              >
                <span class="sidebar-icon">
                  @if (app.svg) {
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path [attr.d]="app.svg" />
                    </svg>
                  } @else {
                    {{ app.icon }}
                  }
                </span>
                <span class="sidebar-label">{{ app.label }}</span>
              </a>
            }
          </div>
        }
      </div>
    </div>

  </nav>

  <main class="content">
    <router-outlet />
  </main>
</div>
