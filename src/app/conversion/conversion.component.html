<div class="container">
  <div class="app-header">
    <h1>Conversion</h1>
    <app-theme-toggle />
  </div>

  <div class="conversion">
  @for (section of sections; track section.title) {
    <div class="conv-panel">
      <h2>{{ section.title }}</h2>

      <div class="conv-input-row">
        <input
          class="conv-input"
          type="number"
          [value]="section.value"
          (input)="onInput($event, section)"
          placeholder="Enter value"
        />
        <select
          class="unit-select"
          [value]="section.fromUnit"
          (change)="onFromUnitChange($event, section)"
        >
          @for (unit of section.units; track unit) {
            <option [value]="unit">{{ unit }}</option>
          }
        </select>
      </div>

      <div class="conv-results">
        @for (unit of section.units; track unit) {
          @if (unit !== section.fromUnit) {
            <div class="conv-result">
              <div class="conv-result-value">{{ resultFor(section, unit) }}</div>
              <div class="conv-result-label">{{ unit }}</div>
            </div>
          }
        }
      </div>

      <div class="conv-fuel">
        @if (section.fuelTypes) {
          <div class="conv-fuel-btns">
            <button
              class="conv-fuel-btn active"
              (click)="toggleFuel(section)"
            >
              <span class="conv-fuel-label">{{ section.activeFuel }}</span>
              <svg
                #fuelIcon
                class="conv-fuel-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M17 1l4 4-4 4" />
                <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                <path d="M7 23l-4-4 4-4" />
                <path d="M21 13v2a4 4 0 0 1-4 4H3" />
              </svg>
            </button>
          </div>
        }
      </div>
    </div>
  }
  </div>
</div>
