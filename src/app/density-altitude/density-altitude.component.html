<div class="container">
  <div class="app-header">
    <h1>Density Altitude</h1>
    <app-theme-toggle />
  </div>

  <div class="da">
    <div class="da-panel">
      <h2 class="da-title">Density Altitude</h2>

      <div class="da-fields">
        <div class="da-field">
          <label class="da-label">Airport Altitude</label>
          <input
            class="da-input"
            type="number"
            [value]="altitude"
            (input)="onInput($event, 'altitude')"
          />
          <select
            class="unit-select"
            [value]="altUnit"
            (change)="altUnit = $any($event.target).value"
          >
            <option value="ft">ft</option>
            <option value="m">m</option>
          </select>
        </div>

        <div class="da-field">
          <label class="da-label">Air Temperature</label>
          <input
            class="da-input"
            type="number"
            [value]="temperature"
            (input)="onInput($event, 'temperature')"
          />
          <select
            class="unit-select"
            [value]="tempUnit"
            (change)="onTempUnitChange($any($event.target).value)"
          >
            <option value="C">°C</option>
            <option value="F">°F</option>
          </select>
        </div>

        <div class="da-field">
          <label class="da-label">Dew Point Temperature</label>
          <input
            class="da-input"
            type="number"
            [value]="dewPoint"
            (input)="onInput($event, 'dewPoint')"
          />
          <div class="da-toggle-row">
            <select
              class="unit-select"
              [value]="dewPointUnit"
              (change)="onDewPointUnitChange($any($event.target).value)"
            >
              <option value="C">°C</option>
              <option value="F">°F</option>
            </select>
            <label class="da-check">
              <input
                type="checkbox"
                [checked]="dryAir"
                (change)="onDryAirChange($event)"
              />
              Dry air approx.
            </label>
          </div>
        </div>

        <div class="da-field">
          <label class="da-label">Airport QNH</label>
          <input
            class="da-input"
            type="number"
            [value]="qnh"
            (input)="onInput($event, 'qnh')"
          />
          <select
            class="unit-select"
            [value]="qnhUnit"
            (change)="onQnhUnitChange($any($event.target).value)"
          >
            <option value="hPa">hPa</option>
            <option value="inHg">inHg</option>
          </select>
        </div>
      </div>

      <div class="da-results">
        <div class="da-result">
          <div class="da-result-value">{{ pressureAltitude }}</div>
          <div class="da-result-label">Pressure Altitude</div>
          <select
            class="unit-select result-select"
            [value]="paUnit"
            (change)="paUnit = $any($event.target).value"
          >
            <option value="ft">ft</option>
            <option value="m">m</option>
          </select>
        </div>

        <div class="da-result">
          <div class="da-result-value">{{ densityAltitude }}</div>
          <div class="da-result-label">Density Altitude</div>
          <select
            class="unit-select result-select"
            [value]="daUnit"
            (change)="daUnit = $any($event.target).value"
          >
            <option value="ft">ft</option>
            <option value="m">m</option>
          </select>
        </div>

        <div class="da-result">
          <div class="da-result-value">{{ airDensity }}</div>
          <div class="da-result-label">Air Density (kg/m³)</div>
          <select
            class="unit-select result-select result-select-hidden"
            [value]="daUnit"
          >
            <option value="ft">ft</option>
            <option value="m">m</option>
          </select>
        </div>
      </div>
    </div>
  </div>
</div>
