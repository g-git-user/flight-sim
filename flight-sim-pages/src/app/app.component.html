<div class="container">
  <h1>Alphabet Radio</h1>

  <div class="controls">
    <span class="label">Nombre de lettres :</span>
    <div class="options">
      @for (n of nbOptions; track n) {
        <button
          class="option"
          [class.active]="nbLetters() === n"
          (click)="setNbLetters(n)"
        >
          {{ n }}
        </button>
      }
    </div>
    <button class="theme" (click)="toggleDark()" [attr.aria-label]="darkMode() ? 'Mode clair' : 'Mode sombre'">
      @if (darkMode()) {
        <img src="icons/sun.svg" alt="Mode clair" />
      } @else {
        <img src="icons/moon.svg" alt="Mode sombre" />
      }
    </button>
  </div>

  <div
    class="card"
    [class.revealed]="revealed()"
    (click)="onCardClick()"
  >
    <div class="card-inner">
      <div class="card-front">
        @for (item of letters(); track item.letter) {
          <span class="front-letter">
            {{ item.letter }}
          </span>
        }
      </div>
      <div class="card-back">
        @for (item of letters(); track item.letter) {
          <div class="item">
            <span class="item-word">
              @for (seg of segmentsFor(item.word); track $index) {
                <span [class.first]="seg.first">{{ seg.char }}</span>
              }
            </span>
          </div>
        }
      </div>
    </div>
  </div>
</div>
